<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>九年級數學互動題庫</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{--font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--bg:#f1f5fa;--panel:#fff;--room:#e6f3e8;--ink:#1b2430;--ink2:#53606f;--line:#d3dce7;--blue:#2f6fdb;--blue-d:#1f4fa8;--orange:#ee8a1f;--orange-d:#b9640a;--violet:#7a52d1;--green:#1f8f55;--amber:#d99a00;--btn:#1b2430;--btn-ink:#fff;--pip:#cfd8e3;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--panel:#1a212b;--room:#1b2b21;--ink:#eaf0f7;--ink2:#a4b0bf;--line:#2e3846;--blue:#6aa0ff;--blue-d:#8cb7ff;--orange:#ffa94d;--orange-d:#ffb869;--violet:#a98bff;--green:#4ed08a;--amber:#ffc83d;--btn:#eaf0f7;--btn-ink:#10151c;--pip:#3a4554;--err:#ff9a92;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
main{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:32px;font-weight:900;line-height:1.25}
header p{margin:2px 0 0;color:var(--ink2);font-size:17px}
.tabs{display:flex;gap:8px}
.picker,.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.picker form,.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
label{font-weight:700;font-size:19px;display:flex;align-items:center;gap:8px}
select,.num{font:inherit;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:6px 8px;max-width:100%}
.num{width:3ch;font-size:26px;font-weight:700;text-align:center;box-sizing:content-box}
.sep{font-size:24px;font-weight:700;color:var(--ink2)}
.btn{font:inherit;font-weight:700;font-size:19px;min-height:48px;padding:6px 20px;border-radius:12px;border:2px solid var(--btn);background:var(--btn);color:var(--btn-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.on{background:var(--green);border-color:var(--green);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#msg{margin:0;min-height:1.4em;color:var(--err);font-size:16px}
.stage.done{background:var(--room);border-color:var(--green)}
.chip{font-size:15px;font-weight:700;padding:2px 12px;border-radius:99px;border:1.5px solid var(--line);color:var(--ink2);margin-right:6px}
svg{width:100%;height:auto;display:block}svg text{font-family:var(--font)}
.i1{fill:var(--blue);stroke:var(--blue-d);stroke-width:2}.i2{fill:var(--orange);stroke:var(--orange-d);stroke-width:2}.i3{fill:var(--violet)}
#cap{min-height:96px}#cap .main{margin:0;font-size:26px;font-weight:700;line-height:1.45}#cap .sub{margin:4px 0 0;font-size:19px;color:var(--ink2)}
b.t1{color:var(--blue)}b.t2{color:var(--orange-d)}b.t3{color:var(--violet)}b.g{color:var(--green)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}.nav .btn{min-height:60px;font-size:22px}
.pips{grid-column:1/-1;display:flex;gap:6px;justify-content:center}
.pip{width:11px;height:11px;border-radius:50%;background:var(--pip)}.pip.on{background:var(--green)}.pip.cur{outline:3px solid var(--amber);outline-offset:1px}
[hidden]{display:none!important}
@media (max-width:520px){h1{font-size:26px}#cap .main{font-size:22px}}
</style></head><body>
<main>
<header><h1>九年級數學互動題庫</h1><p>康軒版・第1～3章</p></header>
<div class="tabs"><button class="btn on" id="tBank">題庫練習</button><button class="btn ghost" id="tCalc">連比計算器</button></div>

<section class="picker" id="pBank"><form onsubmit="return false">
<label>單元 <select id="sel"></select></label>
<button class="btn ghost" type="button" id="rnd">隨機一題</button></form></section>

<section class="picker" id="pCalc" hidden><form onsubmit="return false" class="row">
<label>x:y＝<input class="num" id="a" value="2" maxlength="2"><span class="sep">:</span><input class="num" id="b" value="3" maxlength="2"></label>
<label>y:z＝<input class="num" id="c" value="4" maxlength="2"><span class="sep">:</span><input class="num" id="d" value="5" maxlength="2"></label>
<button class="btn" type="button" id="go">計算連比</button></form><p id="msg" role="status"></p></section>

<section class="stage" id="stage">
<div><span class="chip" id="c1"></span><span class="chip" id="c2"></span></div>
<svg id="svg" viewBox="0 0 640 330" role="img" aria-label="圖示"></svg>
<div id="cap" aria-live="polite"><p class="main" id="m"></p><p class="sub" id="s"></p></div>
<div class="nav"><div class="pips" id="pips"></div>
<button class="btn ghost" id="prev">上一步</button><button class="btn" id="next">下一步</button></div>
</section>
</main>
<script>
(function(){'use strict';
var $=function(i){return document.getElementById(i)};
var esc=function(t){return String(t).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})};
var S=[],st=0,mode='bank',units=[],qi=0,chip1='',chip2='';
/* ---- 圖形 ---- */
function bars(arr,cls){var mx=Math.max.apply(null,arr),h='',n=arr.length,u=470/mx,names=['x','y','z'];
 arr.forEach(function(v,i){var y=30+i*70;h+='<text x="10" y="'+(y+28)+'" font-size="22" font-weight="900" fill="var(--ink2)">'+names[i]+'</text><rect class="i'+(i%3+1)+'" x="50" y="'+y+'" width="'+(v*u)+'" height="40" rx="6"/><text x="'+(60+v*u)+'" y="'+(y+29)+'" font-size="22" font-weight="900" fill="var(--ink)">'+v+'</text>'});return h}
function tri(){return '<polygon points="320,20 100,300 540,300" fill="none" stroke="var(--ink2)" stroke-width="3"/><line x1="232" y1="132" x2="408" y2="132" stroke="var(--orange)" stroke-width="4"/><g font-size="22" font-weight="900" fill="var(--ink)"><text x="312" y="14">A</text><text x="68" y="312">B</text><text x="548" y="312">C</text><text x="204" y="138">D</text><text x="416" y="138">E</text></g><text x="320" y="120" font-size="18" text-anchor="middle" fill="var(--orange-d)">DE ∥ BC</text>'}
/* ---- 舞台 ---- */
function show(){var p=S[st],i,h='';$('c1').textContent=chip1;$('c2').textContent=chip2+(S.length?'步驟 '+(st+1)+'/'+S.length:'');
 $('svg').innerHTML=p.svg||'';$('svg').hidden=!p.svg;$('m').innerHTML=p.m;$('s').innerHTML=p.s||'';
 for(i=0;i<S.length;i++)h+='<i class="pip'+(i<=st?' on':'')+(i===st?' cur':'')+'"></i>';$('pips').innerHTML=h;
 $('prev').disabled=st===0;$('next').disabled=st===S.length-1;$('next').textContent=st===S.length-1?'完成':'下一步';
 $('stage').classList.toggle('done',st===S.length-1)}
function go(d){var n=st+d;if(n<0||n>=S.length)return;st=n;show()}
/* ---- 題庫 ---- */
function loadQ(){var u=units[$('sel').value],q=u.qs[qi],a=q[1],k=a.lastIndexOf('→'),svg='',m,t,
 r=a.match(/(\d+):(\d+):(\d+)/g);
 if(/連比/.test(u.label)&&r){var nn=r[r.length-1].split(':').map(Number);if(Math.max.apply(null,nn)<=40)svg=bars(nn)}
 if(/1-2.*(② 平行線|④ 三角形兩邊)/.test(u.label))svg=tri();
 chip1=u.label.split('｜')[1];chip2='第 '+(qi+1)+'/'+u.qs.length+' 題・';
 S=[{m:'<b class="t1">題目</b>：'+esc(q[0]),s:'先自己想一想，再按「下一步」。',svg:svg}];
 if(k>0)S.push({m:'<b class="t2">解題想法</b>',s:esc(a.slice(0,k).replace(/[；，\s]+$/,'')),svg:svg});
 S.push({m:'答案：<b class="g">'+esc(k>0?a.slice(k+1).trim():a)+'</b>',s:'按「隨機一題」或換單元繼續練習。',svg:svg});
 st=0;show()}
function pick(){var u=units[$('sel').value];qi=Math.floor(Math.random()*u.qs.length);loadQ()}
/* ---- 連比計算器 ---- */
function gcd(x,y){return y?gcd(y,x%y):x}
function calc(){var a=+$('a').value,b=+$('b').value,c=+$('c').value,d=+$('d').value,v=[a,b,c,d].every(function(n){return n>=1&&n<=9});
 if(!v){$('msg').textContent='請輸入 1 到 9 之間的數字。';return}$('msg').textContent='';
 var L=b*c/gcd(b,c),x=a*L/b,y=L,z=d*L/c,m1=L/b,m2=L/c;chip1='連比計算器';chip2='';
 S=[{m:'已知 <b class="t1">x:y＝'+a+':'+b+'</b>，<b class="t2">y:z＝'+c+':'+d+'</b>。',s:'兩個比裡都有 y，但 y 的份數不同（'+b+' 和 '+c+'）。',svg:bars([a,b],0)},
 {m:'第一步：把兩個 y 變成一樣多。',s:''+b+' 和 '+c+' 的最小公倍數是 <b class="g">'+L+'</b>。',svg:bars([a,b])},
 {m:'第二步：x:y 同乘 '+m1+'，y:z 同乘 '+m2+'。',s:'x:y＝'+a+'×'+m1+' : '+b+'×'+m1+'＝<b class="t1">'+x+':'+y+'</b>；y:z＝'+c+'×'+m2+' : '+d+'×'+m2+'＝<b class="t2">'+y+':'+z+'</b>',svg:bars([x,y,z])},
 {m:'連比 x:y:z＝<b class="g">'+x+':'+y+':'+z+'</b>',s:'y 一樣大，就能把兩個比接在一起。',svg:bars([x,y,z])}];
 st=0;show()}
/* ---- 初始化 ---- */
function mode_(m){mode=m;$('pBank').hidden=m!=='bank';$('pCalc').hidden=m!=='calc';$('tBank').className='btn '+(m==='bank'?'on':'ghost');$('tCalc').className='btn '+(m==='calc'?'on':'ghost');m==='bank'?(units.length&&pick()):calc()}
$('tBank').onclick=function(){mode_('bank')};$('tCalc').onclick=function(){mode_('calc')};
$('sel').onchange=pick;$('rnd').onclick=pick;$('go').onclick=calc;$('prev').onclick=function(){go(-1)};$('next').onclick=function(){go(1)};
document.addEventListener('keydown',function(e){if(/INPUT|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});
fetch('data/curriculum.json').then(function(r){return r.json()}).then(function(D){var h='';
 D.chapters.forEach(function(ch){ch.sections.forEach(function(se){h+='<optgroup label="'+esc(se.name)+'">';se.topics.forEach(function(tp){tp.concepts.forEach(function(c){units.push({label:se.name+'｜'+c.name,qs:c.qs});h+='<option value="'+(units.length-1)+'">'+esc(c.name)+'</option>'})});h+='</optgroup>'})});
 $('sel').innerHTML=h;pick()}).catch(function(){S=[{m:'無法載入題目資料',s:'請確認 data/curriculum.json 在同一資料夾內。'}];st=0;show()});
})();
</script></body></html>
